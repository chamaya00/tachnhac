# Nạp file cookie YouTube vào Modal Volume.
#
# Có workflow này vì `modal volume put` đòi máy tính có cài Modal CLI, mà cả dự
# án này vốn làm từ điện thoại. Cách dùng: dán nội dung cookies.txt vào secret
# YTDLP_COOKIES rồi bấm Run workflow — cả hai bước đều làm được trên iPhone.
name: Nạp cookie YouTube

on:
  workflow_dispatch:
    inputs:
      xoa:
        description: "Xoá cookie đang có thay vì nạp mới"
        type: boolean
        default: false
      nap_proxy:
        description: "Nạp cả proxy từ secret YTDLP_PROXY (nếu có mua)"
        type: boolean
        default: false

jobs:
  cookies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install modal

      - name: Xoá cookie
        if: ${{ inputs.xoa }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal volume rm tachnhac-data /cookies.txt || \
            echo "Không có cookie nào để xoá — coi như xong."

      - name: Kiểm tra secret
        if: ${{ !inputs.xoa }}
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          if [ -z "$YTDLP_COOKIES" ]; then
            echo "::error::Chưa có secret YTDLP_COOKIES. Vào Settings → Secrets and variables → Actions → New repository secret, đặt tên YTDLP_COOKIES và dán toàn bộ nội dung file cookies.txt vào."
            exit 1
          fi

      # printf giữ nguyên xuống dòng; echo có shell biến \t thành ký tự khác.
      - name: Ghi file cookie
        if: ${{ !inputs.xoa }}
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: printf '%s\n' "$YTDLP_COOKIES" > cookies.txt

      - name: Soi file trước khi nạp
        if: ${{ !inputs.xoa }}
        run: python3 scripts/check_cookies.py cookies.txt

      - name: Nạp lên Modal Volume
        if: ${{ !inputs.xoa }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal volume put tachnhac-data cookies.txt /cookies.txt --force

      # Proxy dân cư là cách duy nhất chữa dứt điểm chặn theo IP, nhưng tốn tiền.
      # Để sẵn đường nạp, ai mua thì dùng.
      - name: Nạp proxy
        if: ${{ inputs.nap_proxy && !inputs.xoa }}
        env:
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$YTDLP_PROXY" ]; then
            echo "::error::Chưa có secret YTDLP_PROXY. Dạng: http://user:pass@host:port"
            exit 1
          fi
          case "$YTDLP_PROXY" in
            http://*|https://*|socks5://*|socks5h://*) ;;
            *) echo "::error::Proxy phải bắt đầu bằng http:// https:// socks5:// hoặc socks5h://"; exit 1 ;;
          esac
          printf '%s' "$YTDLP_PROXY" > proxy.txt
          modal volume put tachnhac-data proxy.txt /proxy.txt --force
          rm -f proxy.txt
          echo "Đã nạp proxy."

      - name: Xoá dấu vết trên runner
        if: always()
        run: rm -f cookies.txt proxy.txt

      - name: Xong
        run: |
          if [ "${{ inputs.xoa }}" = "true" ]; then
            echo "Đã xoá cookie. Backend quay về chạy không cookie."
          else
            echo "Đã nạp cookie. Không cần deploy lại — job sau sẽ tự dùng."
            echo "Kiểm tra: mở <URL backend>/diag/cookies trên trình duyệt."
          fi
